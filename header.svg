<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Degradado brutalista cálido (Platino -> Oro cálido -> Terracota -> Cobre) -->
    <linearGradient id="brutalistGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FCE1BE" />
      <stop offset="75%" stop-color="#E88B58" />
      <stop offset="100%" stop-color="#BA4623" />
    </linearGradient>

    <!-- Línea sutil de acento láser -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BA4623" stop-opacity="0" />
      <stop offset="25%" stop-color="#E88B58" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#E88B58" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BA4623" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .sub-role {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 12px;
      letter-spacing: 11px;
      font-weight: 500;
      text-anchor: middle;
      fill: #8b949e;
      text-transform: uppercase;
    }
  </style>

  <!-- Tarjeta de fondo sobria y minimalista -->
  <rect width="900" height="180" rx="16" fill="#08090d" stroke="#1f242c" stroke-width="1.2" />

  <!-- Tipografía arquitectónica brutalista vectorizada (100% custom) -->
  <g transform="translate(151.0, 48) scale(1.35)" fill="url(#brutalistGrad)">
    <!-- E -->
    <path d="M 0,0 H 30 L 36,6 V 12 H 12 V 21 H 28 V 33 H 12 V 42 H 36 V 48 L 30,54 H 0 Z" transform="translate(0.0, 0)" />
    <!-- N -->
    <path d="M 0,0 H 12 L 26,30 V 0 H 40 V 54 H 28 L 14,24 V 54 H 0 Z" transform="translate(48.0, 0)" />
    <!-- E -->
    <path d="M 0,0 H 30 L 36,6 V 12 H 12 V 21 H 28 V 33 H 12 V 42 H 36 V 48 L 30,54 H 0 Z" transform="translate(100.0, 0)" />
    <!-- K -->
    <path d="M 0,0 H 12 V 22 L 25,0 H 39 L 21,26 L 40,54 H 26 L 12,33 V 54 H 0 Z" transform="translate(148.0, 0)" />
    <!-- O -->
    <path d="M 10,0 H 32 L 42,10 V 44 L 32,54 H 10 L 0,44 V 10 Z M 12,14 V 40 H 30 V 14 Z" transform="translate(200.0, 0)" />
    <!-- R -->
    <path d="M 0,0 H 26 L 36,10 V 22 L 26,31 H 12 V 54 H 0 Z M 12,11 H 23 L 26,14 V 18 L 23,21 H 12 Z M 18,30 L 37,54 H 23 L 12,38 V 30 Z" transform="translate(278.0, 0)" />
    <!-- U -->
    <path d="M 0,0 H 12 V 40 L 16,44 H 26 L 30,40 V 0 H 42 V 42 L 34,54 H 8 L 0,46 Z" transform="translate(327.0, 0)" />
    <!-- I -->
    <path d="M 0,0 H 12 V 54 H 0 Z" transform="translate(381.0, 0)" />
    <!-- Z -->
    <path d="M 0,0 H 32 L 38,6 V 12 L 15,42 H 38 V 54 H 6 L 0,48 V 42 L 23,12 H 0 Z" transform="translate(405.0, 0)" />
  </g>

  <!-- Línea de acento -->
  <line x1="310.0" y1="134" x2="590.0" y2="134" stroke="url(#lineGrad)" stroke-width="1.2" />

  <!-- Subtítulo -->
  <text x="450" y="156" class="sub-role">SOFTWARE ENGINEER</text>
</svg>
