<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FCE1BE" />
      <stop offset="70%" stop-color="#F0A65B" />
      <stop offset="100%" stop-color="#D96843" />
    </linearGradient>
  </defs>

  <!-- Nombre Principal en Vector Tipográfico Gigante -->
  <text x="50%" y="80" 
        text-anchor="middle" 
        fill="url(#goldGradient)" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="12">
    ENEKO RUIZ
  </text>

  <!-- Línea sutil de acento -->
  <line x1="390" y1="104" x2="510" y2="104" stroke="#D96843" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Subtítulo técnico -->
  <text x="50%" y="132" 
        text-anchor="middle" 
        fill="#8b949e" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="7">
    SOFTWARE ENGINEER
  </text>
</svg>
